name: workflow-contract

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  contract:
    name: workflow-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise the control-plane contract seam
        run: go test ./internal/plan ./internal/store ./internal/agent ./internal/delivery ./internal/github
      - name: Verify the Owner-Guarded repository contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="$(gh api "repos/${GITHUB_REPOSITORY}")"
          default_branch="$(jq -r '.default_branch' <<<"$repository")"
          jq -e '.full_name == env.GITHUB_REPOSITORY and ((.owner.login | ascii_downcase) == (env.GITHUB_REPOSITORY_OWNER | ascii_downcase)) and (.default_branch | length > 0)' <<<"$repository" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${default_branch}" --jq '.object.sha' | grep -Eq '^[0-9a-f]{40}$'
          gh api "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=1" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=1" >/dev/null
