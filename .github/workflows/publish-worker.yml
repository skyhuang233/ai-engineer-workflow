name: publish-worker

on:
  push:
    branches: [main]
    paths:
      - "deploy/worker/**"
      - "config/toolchain.json"
      - ".github/workflows/publish-worker.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-worker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Read accepted release inputs
        id: pins
        shell: bash
        run: |
          echo "worker_version=$(jq -r .worker.version config/toolchain.json)" >> "$GITHUB_OUTPUT"
          echo "image_repository=$(jq -r .worker.image_repository config/toolchain.json)" >> "$GITHUB_OUTPUT"
          echo "codex_version=$(jq -r .codex.version config/toolchain.json)" >> "$GITHUB_OUTPUT"
          echo "no_mistakes_version=$(jq -r .no_mistakes.version config/toolchain.json)" >> "$GITHUB_OUTPUT"
          echo "no_mistakes_commit=$(jq -r .no_mistakes.upstream_commit config/toolchain.json)" >> "$GITHUB_OUTPUT"
          echo "no_mistakes_fork_repository=$(jq -r .no_mistakes.fork_repository config/toolchain.json)" >> "$GITHUB_OUTPUT"
          echo "no_mistakes_fork_release=$(jq -r .no_mistakes.fork_release config/toolchain.json)" >> "$GITHUB_OUTPUT"
          echo "no_mistakes_sha256=$(jq -r .no_mistakes.linux_amd64_sha256 config/toolchain.json)" >> "$GITHUB_OUTPUT"
      - name: Detect Worker release input changes
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          required=false
          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}:config/toolchain.json" 2>/dev/null; then
            required=true
          else
            git show "${BEFORE_SHA}:config/toolchain.json" |
              jq --sort-keys '{codex,no_mistakes,worker}' > /tmp/worker-inputs-before.json
            jq --sort-keys '{codex,no_mistakes,worker}' config/toolchain.json > /tmp/worker-inputs-now.json
            if ! cmp --silent /tmp/worker-inputs-before.json /tmp/worker-inputs-now.json ||
               ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- deploy/worker; then
              required=true
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
      - name: Preserve immutable release identity on reruns
        id: existing
        if: steps.changes.outputs.required == 'true'
        shell: bash
        env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="worker-v${{ steps.pins.outputs.worker_version }}"
          if release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null)"; then
            target="$(jq -r .target_commitish <<<"$release")"
            test "$target" = "$GITHUB_SHA" || {
              echo "Worker version already belongs to a different accepted commit" >&2
              exit 1
            }
            asset_id="$(jq -r '[.assets[]? | select(.name == "worker-release.json") | .id] | if length == 1 then .[0] else empty end' <<<"$release")"
            test -n "$asset_id" || {
              echo "Existing Worker Release has no unambiguous release manifest" >&2
              exit 1
            }
            gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > worker-release.json
            jq --exit-status \
              --arg worker_version "${{ steps.pins.outputs.worker_version }}" \
              --arg source_commit "$GITHUB_SHA" \
              --arg image_repository "${{ steps.pins.outputs.image_repository }}" \
              --arg codex_version "${{ steps.pins.outputs.codex_version }}" \
              --arg no_mistakes_version "${{ steps.pins.outputs.no_mistakes_version }}" \
              --arg no_mistakes_commit "${{ steps.pins.outputs.no_mistakes_commit }}" \
              --arg no_mistakes_fork_repository "${{ steps.pins.outputs.no_mistakes_fork_repository }}" \
              --arg no_mistakes_fork_release "${{ steps.pins.outputs.no_mistakes_fork_release }}" \
              --arg no_mistakes_linux_amd64_sha256 "${{ steps.pins.outputs.no_mistakes_sha256 }}" \
              '(.schema_version == 1) and
               (.worker_version == $worker_version) and
               (.source_commit == $source_commit) and
               (.image | type == "string") and
               (.image | startswith($image_repository + "@sha256:")) and
               (.image | test("^.+@sha256:[0-9a-f]{64}$")) and
               (.codex_version == $codex_version) and
               (.no_mistakes_version == $no_mistakes_version) and
               (.no_mistakes_commit == $no_mistakes_commit) and
               (.no_mistakes_fork_repository == $no_mistakes_fork_repository) and
               (.no_mistakes_fork_release == $no_mistakes_fork_release) and
               (.no_mistakes_linux_amd64_sha256 == $no_mistakes_linux_amd64_sha256) and
               (.github_actions_run_id | type == "number" and . > 0)' \
              worker-release.json > /dev/null || {
                echo "Existing Worker Release has an incomplete or invalid release manifest" >&2
                exit 1
              }
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: steps.changes.outputs.required == 'true' && steps.existing.outputs.exists != 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: steps.changes.outputs.required == 'true' && steps.existing.outputs.exists != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish accepted main commit
        id: build
        if: steps.changes.outputs.required == 'true' && steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/worker/Dockerfile
          push: true
          tags: ${{ steps.pins.outputs.image_repository }}:${{ steps.pins.outputs.worker_version }}
          build-args: |
            CODEX_VERSION=${{ steps.pins.outputs.codex_version }}
            NO_MISTAKES_VERSION=${{ steps.pins.outputs.no_mistakes_version }}
            NO_MISTAKES_FORK_RELEASE=${{ steps.pins.outputs.no_mistakes_fork_release }}
            NO_MISTAKES_SHA256=${{ steps.pins.outputs.no_mistakes_sha256 }}
      - name: Create authoritative Worker Release Manifest
        if: steps.changes.outputs.required == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          jq --null-input \
            --arg worker_version "${{ steps.pins.outputs.worker_version }}" \
            --arg source_commit "${GITHUB_SHA}" \
            --arg image "${{ steps.pins.outputs.image_repository }}@${IMAGE_DIGEST}" \
            --arg codex_version "${{ steps.pins.outputs.codex_version }}" \
            --arg no_mistakes_version "${{ steps.pins.outputs.no_mistakes_version }}" \
            --arg no_mistakes_commit "${{ steps.pins.outputs.no_mistakes_commit }}" \
            --arg no_mistakes_fork_repository "${{ steps.pins.outputs.no_mistakes_fork_repository }}" \
            --arg no_mistakes_fork_release "${{ steps.pins.outputs.no_mistakes_fork_release }}" \
            --arg no_mistakes_linux_amd64_sha256 "${{ steps.pins.outputs.no_mistakes_sha256 }}" \
            --argjson github_actions_run_id "${GITHUB_RUN_ID}" \
            '{schema_version:1, worker_version:$worker_version, source_commit:$source_commit,
              image:$image, codex_version:$codex_version, no_mistakes_version:$no_mistakes_version,
              no_mistakes_commit:$no_mistakes_commit, no_mistakes_fork_repository:$no_mistakes_fork_repository,
              no_mistakes_fork_release:$no_mistakes_fork_release,
              no_mistakes_linux_amd64_sha256:$no_mistakes_linux_amd64_sha256, github_actions_run_id:$github_actions_run_id}' \
            > worker-release.json
          jq --exit-status . worker-release.json
      - name: Publish Worker Release Manifest
        if: steps.changes.outputs.required == 'true' && steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: worker-v${{ steps.pins.outputs.worker_version }}
          target_commitish: ${{ github.sha }}
          name: Worker v${{ steps.pins.outputs.worker_version }}
          body: Immutable Worker image and cross-host release manifest for an owner-accepted main commit.
          files: worker-release.json
