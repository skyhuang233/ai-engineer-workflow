name: publish-workflow

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: publish-workflow
  cancel-in-progress: false

jobs:
  accepted-merge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test the accepted main merge
        run: go test -p 1 ./...
      - name: Vet the accepted main merge
        run: go vet ./...

  worker:
    needs: accepted-merge
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.admission.outputs.version }}
      tag: ${{ steps.admission.outputs.tag }}
      image_repository: ${{ steps.pins.outputs.worker_image_repository }}
      image_digest: ${{ steps.pushed.outputs.digest }}
      allow_existing_tag: ${{ steps.preflight.outputs.allow_existing_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Admit owner-merged release or hotfix
        id: admission
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq --exit-status --raw-output '.version | select(test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))' config/workflow-release.json)"
          test "$version" != "0.0.0" || { echo "the development baseline 0.0.0 is never publishable" >&2; exit 1; }
          owner="$(jq --exit-status --raw-output '.github.credential.owner | select(type == "string" and length > 0)' config/toolchain.json)"
          workflow_release_count="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp | jq '[.[][] | select(.draft == false and .prerelease == false and .immutable == true and (.tag_name | test("^workflow-v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")))] | length')"
          if [ "$workflow_release_count" -eq 0 ] && [ "$version" != "0.0.1" ]; then
            echo "the first Workflow Release must be workflow-v0.0.1" >&2
            exit 1
          fi
          pulls="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
          pull_number="$(jq --raw-output --arg sha "$GITHUB_SHA" '[.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main")] | if length == 1 then .[0].number else empty end' <<<"$pulls")"
          test -n "$pull_number" || { echo "main commit lacks one merged pull request" >&2; exit 1; }
          pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pull_number}")"
          head_ref="$(jq --exit-status --raw-output '.head.ref' <<<"$pull")"
          head_sha="$(jq --exit-status --raw-output '.head.sha | select(test("^[0-9a-f]{40}$"))' <<<"$pull")"
          case "$head_ref" in
            "release-${version}"|"hotfix-${version}") ;;
            *) echo "publisher accepts only release-${version} or hotfix-${version}" >&2; exit 1 ;;
          esac
          jq --exit-status --arg owner "$owner" --arg sha "$GITHUB_SHA" '
            .merged_at != null and .merge_commit_sha == $sha and .base.ref == "main" and
            ((.merged_by.login // "") | ascii_downcase) == ($owner | ascii_downcase) and
            ((.merged_by.type // "") | ascii_downcase) == "user" and
            (((.merged_by.login // "") | ascii_downcase | endswith("[bot]")) | not)
          ' <<<"$pull" >/dev/null
          integration="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}")"
          jq --exit-status --arg head "$head_sha" '
            (.parents | length) == 2 and any(.parents[]; .sha == $head)
          ' <<<"$integration" >/dev/null || { echo "publisher requires a two-parent merge containing the exact pull request head" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=workflow-v${version}" >> "$GITHUB_OUTPUT"
      - name: Preflight Workflow Release target
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.admission.outputs.tag }}"
          release_state="fresh"
          if ! release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/tmp/release-error)"; then
            grep -q 'HTTP 404' /tmp/release-error || { cat /tmp/release-error >&2; exit 1; }
          else
            test "$(jq -r .target_commitish <<<"$release")" = "$GITHUB_SHA" || { echo "version belongs to another source" >&2; exit 1; }
            if jq -e '.draft == true and .immutable != true' <<<"$release" >/dev/null; then
              release_state="retry"
            elif jq -e '.immutable == true and .draft == false and .prerelease == false' <<<"$release" >/dev/null; then
              release_state="immutable"
            else
              echo "existing release is not retryable or an exact immutable result" >&2
              exit 1
            fi
          fi
          tag_exists="false"
          if ! tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>/tmp/tag-error)"; then
            grep -q 'HTTP 404' /tmp/tag-error || { cat /tmp/tag-error >&2; exit 1; }
          else
            tag_exists="true"
            jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' <<<"$tag_ref" >/dev/null || { echo "tag does not directly reference this source commit" >&2; exit 1; }
          fi
          if [ "$release_state" = "fresh" ] && [ "$tag_exists" = "true" ]; then
            echo "fresh release target already has a tag" >&2
            exit 1
          elif [ "$release_state" = "immutable" ] && [ "$tag_exists" != "true" ]; then
            echo "immutable release is missing its direct source tag" >&2
            exit 1
          elif [ "$release_state" = "retry" ]; then
            gh release delete "$tag" --yes --cleanup-tag=false
          elif [ "$release_state" = "immutable" ]; then
            : # Build the fresh candidate so the immutable result can be compared exactly.
          fi
          if [ "$release_state" = "retry" ] && [ "$tag_exists" = "true" ]; then
            echo "allow_existing_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "allow_existing_tag=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read Worker pins
        id: pins
        shell: bash
        run: |
          jq --exit-status '.worker.version? | not' config/toolchain.json >/dev/null
          for key in codex.version github_cli.version github_cli.linux_amd64_sha256 go.version go.linux_amd64_sha256 no_mistakes.version no_mistakes.repository no_mistakes.commit worker.image_repository; do
            echo "${key//./_}=$(jq --exit-status --raw-output ".${key}" config/toolchain.json)" >> "$GITHUB_OUTPUT"
          done
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release candidate locally
        id: image
        shell: bash
        run: |
          staging="${{ steps.pins.outputs.worker_image_repository }}:build-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash scripts/build-workflow-worker.sh "$staging"
          echo "staging=$staging" >> "$GITHUB_OUTPUT"
      - name: Generate Worker SBOM before push
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ steps.image.outputs.staging }}
          format: spdx-json
          output-file: worker-sbom.spdx.json
          upload-artifact: false
      - name: Scan Worker before push
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          sbom: worker-sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Push only the scan-passing image
        id: pushed
        shell: bash
        run: |
          docker push "${{ steps.image.outputs.staging }}"
          digest="$(docker buildx imagetools inspect "${{ steps.image.outputs.staging }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Transfer verified Worker inputs to Windows publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-release-inputs
          path: worker-sbom.spdx.json
          if-no-files-found: error

  publish:
    needs: worker
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: workflow-release-inputs
          path: build/release-inputs
      - name: Assemble the atomic Workflow Release
        shell: pwsh
        run: |
          & scripts/assemble-workflow-release.ps1 `
            -SourceCommit $env:GITHUB_SHA -GitHubActionsRunID $env:GITHUB_RUN_ID `
            -WorkerImage '${{ needs.worker.outputs.image_repository }}@${{ needs.worker.outputs.image_digest }}' `
            -SBOMPath build/release-inputs/worker-sbom.spdx.json -OutputDirectory build/release
      - name: Resolve fresh, retry, or immutable state
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.worker.outputs.tag }}"
          if ! release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/tmp/release-error)"; then
            grep -q 'HTTP 404' /tmp/release-error || { cat /tmp/release-error >&2; exit 1; }
            if ! tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>/tmp/tag-error)"; then
              grep -q 'HTTP 404' /tmp/tag-error || { cat /tmp/tag-error >&2; exit 1; }
            else
              test "${{ needs.worker.outputs.allow_existing_tag }}" = "true" || { echo "fresh release target acquired a tag after preflight" >&2; exit 1; }
              jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' <<<"$tag_ref" >/dev/null || { echo "tag changed after preflight" >&2; exit 1; }
            fi
            echo "state=fresh" >> "$GITHUB_OUTPUT"; exit 0
          fi
          test "$(jq -r .target_commitish <<<"$release")" = "$GITHUB_SHA" || { echo "version belongs to another source" >&2; exit 1; }
          if jq -e '.immutable == true and .draft == false and .prerelease == false' <<<"$release" >/dev/null; then
            jq -e '([.assets[].name] | sort) == (["worker-sbom.spdx.json","workflow-release.json","workflow-windows-amd64.zip"] | sort)' <<<"$release" >/dev/null
            for name in worker-sbom.spdx.json workflow-release.json workflow-windows-amd64.zip; do
              digest="$(sha256sum "build/release/$name" | awk '{print $1}')"
              jq -e --arg name "$name" --arg digest "sha256:$digest" '[.assets[] | select(.name == $name and .digest == $digest)] | length == 1' <<<"$release" >/dev/null
            done
            tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
            jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' <<<"$tag_ref" >/dev/null
            echo "state=immutable" >> "$GITHUB_OUTPUT"
          else
            echo "release target changed after preflight" >&2; exit 1
          fi
      - name: Stage exactly three assets
        if: steps.release.outputs.state == 'fresh'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.worker.outputs.tag }}" build/release/workflow-windows-amd64.zip build/release/workflow-release.json build/release/worker-sbom.spdx.json --draft --target "$GITHUB_SHA" --title "Workflow ${{ needs.worker.outputs.version }}" --notes "Immutable atomic Agent Workflow release."
      - name: Publish and verify immutable result
        if: steps.release.outputs.state == 'fresh'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.worker.outputs.tag }}"; gh release edit "$tag" --draft=false
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          jq --exit-status --arg sha "$GITHUB_SHA" '.draft == false and .prerelease == false and .immutable == true and .target_commitish == $sha and ([.assets[].name] | sort) == (["worker-sbom.spdx.json","workflow-release.json","workflow-windows-amd64.zip"] | sort)' <<<"$release" >/dev/null
          for name in worker-sbom.spdx.json workflow-release.json workflow-windows-amd64.zip; do
            digest="$(sha256sum "build/release/$name" | awk '{print $1}')"
            jq -e --arg name "$name" --arg digest "sha256:$digest" '[.assets[] | select(.name == $name and .digest == $digest)] | length == 1' <<<"$release" >/dev/null
          done
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
          jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' <<<"$tag_ref" >/dev/null
