name: publish-workflow

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: publish-workflow
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.admission.outputs.version }}
      tag: ${{ steps.admission.outputs.tag }}
      identity: ${{ steps.identity.outputs.identity }}
      image_repository: ${{ steps.pins.outputs.worker_image_repository }}
      image_digest: ${{ steps.pushed.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Admit owner-merged release or hotfix
        id: admission
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq --exit-status --raw-output '.version | select(test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))' config/workflow-release.json)"
          test "$version" != "0.0.0" || { echo "the development baseline 0.0.0 is never publishable" >&2; exit 1; }
          owner="$(jq --exit-status --raw-output '.github.credential.owner | select(type == "string" and length > 0)' config/toolchain.json)"
          workflow_release_count="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp | jq '[.[][] | select(.draft == false and .prerelease == false and .immutable == true and (.tag_name | test("^workflow-v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")))] | length')"
          if [ "$workflow_release_count" -eq 0 ] && [ "$version" != "0.0.1" ]; then
            echo "the first Workflow Release must be workflow-v0.0.1" >&2
            exit 1
          fi
          pulls="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
          pull_number="$(jq --raw-output --arg sha "$GITHUB_SHA" '[.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main")] | if length == 1 then .[0].number else empty end' <<<"$pulls")"
          test -n "$pull_number" || { echo "main commit lacks one merged pull request" >&2; exit 1; }
          pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pull_number}")"
          head="$(jq --exit-status --raw-output '.head.ref' <<<"$pull")"
          case "$head" in
            "release-${version}"|"hotfix-${version}") ;;
            *) echo "publisher accepts only release-${version} or hotfix-${version}" >&2; exit 1 ;;
          esac
          jq --exit-status --arg owner "$owner" --arg sha "$GITHUB_SHA" '
            .merged_at != null and .merge_commit_sha == $sha and .base.ref == "main" and
            ((.merged_by.login // "") | ascii_downcase) == ($owner | ascii_downcase) and
            ((.merged_by.type // "") | ascii_downcase) == "user" and
            (((.merged_by.login // "") | ascii_downcase | endswith("[bot]")) | not)
          ' <<<"$pull" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=workflow-v${version}" >> "$GITHUB_OUTPUT"
      - name: Read Worker pins
        id: pins
        shell: bash
        run: |
          jq --exit-status '.worker.version? | not' config/toolchain.json >/dev/null
          for key in codex.version github_cli.version github_cli.linux_amd64_sha256 go.version go.linux_amd64_sha256 no_mistakes.version no_mistakes.upstream_commit no_mistakes.fork_repository no_mistakes.fork_commit no_mistakes.fork_release no_mistakes.linux_amd64_sha256 worker.image_repository; do
            echo "${key//./_}=$(jq --exit-status --raw-output ".${key}" config/toolchain.json)" >> "$GITHUB_OUTPUT"
          done
      - name: Compute canonical Worker build identity
        id: identity
        shell: bash
        run: |
          go run ./cmd/workflow-release identity \
            -toolchain config/toolchain.json \
            -deploy-worker-tree "$(git rev-parse "${GITHUB_SHA}:deploy/worker")" \
            -delivery-source-digest-tree "$(git rev-parse "${GITHUB_SHA}:cmd/delivery-source-digest")" \
            -delivery-source-tree "$(git rev-parse "${GITHUB_SHA}:internal/deliverysource")" \
            -go-mod-blob "$(git rev-parse "${GITHUB_SHA}:go.mod")" \
            -go-sum-blob "$(git rev-parse "${GITHUB_SHA}:go.sum")" \
            -publish-workflow-blob "$(git rev-parse "${GITHUB_SHA}:.github/workflows/publish-workflow.yml")" \
            -output build-input.json > build-input.sha256
          identity="$(tr -d '\r\n' < build-input.sha256)"
          [[ "$identity" =~ ^[0-9a-f]{64}$ ]]
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "staging=${{ steps.pins.outputs.worker_image_repository }}:build-${identity}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve retry image or build locally
        id: image
        shell: bash
        run: |
          staging="${{ steps.identity.outputs.staging }}"
          pull_error="$(mktemp)"
          if docker pull "$staging" 2>"$pull_error"; then
            rm "$pull_error"
            echo "reused=true" >> "$GITHUB_OUTPUT"
          elif grep --extended-regexp --ignore-case --quiet 'not found|manifest unknown|no such manifest|HTTP 404' "$pull_error"; then
            rm "$pull_error"
            docker build \
              --build-arg "CODEX_VERSION=${{ steps.pins.outputs.codex_version }}" \
              --build-arg "GITHUB_CLI_VERSION=${{ steps.pins.outputs.github_cli_version }}" \
              --build-arg "GITHUB_CLI_LINUX_AMD64_SHA256=${{ steps.pins.outputs.github_cli_linux_amd64_sha256 }}" \
              --build-arg "GO_VERSION=${{ steps.pins.outputs.go_version }}" \
              --build-arg "GO_LINUX_AMD64_SHA256=${{ steps.pins.outputs.go_linux_amd64_sha256 }}" \
              --build-arg "NO_MISTAKES_VERSION=${{ steps.pins.outputs.no_mistakes_version }}" \
              --build-arg "NO_MISTAKES_UPSTREAM_COMMIT=${{ steps.pins.outputs.no_mistakes_upstream_commit }}" \
              --build-arg "NO_MISTAKES_FORK_COMMIT=${{ steps.pins.outputs.no_mistakes_fork_commit }}" \
              --build-arg "NO_MISTAKES_FORK_REPOSITORY=${{ steps.pins.outputs.no_mistakes_fork_repository }}" \
              --build-arg "NO_MISTAKES_FORK_RELEASE=${{ steps.pins.outputs.no_mistakes_fork_release }}" \
              --build-arg "NO_MISTAKES_SHA256=${{ steps.pins.outputs.no_mistakes_linux_amd64_sha256 }}" \
              --tag "$staging" --file deploy/worker/Dockerfile .
            echo "reused=false" >> "$GITHUB_OUTPUT"
          else
            cat "$pull_error" >&2
            rm "$pull_error"
            echo "unable to determine whether the deterministic staging image exists" >&2
            exit 1
          fi
      - name: Generate Worker SBOM before push
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ steps.identity.outputs.staging }}
          format: spdx-json
          output-file: worker-sbom.spdx.json
          upload-artifact: false
      - name: Scan Worker before push
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          sbom: worker-sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Push only the scan-passing image
        id: pushed
        shell: bash
        run: |
          if [ "${{ steps.image.outputs.reused }}" != true ]; then docker push "${{ steps.identity.outputs.staging }}"; fi
          digest="$(docker buildx imagetools inspect "${{ steps.identity.outputs.staging }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Transfer verified Worker inputs to Windows publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-release-inputs
          path: |
            build-input.json
            worker-sbom.spdx.json
          if-no-files-found: error

  publish:
    needs: worker
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: workflow-release-inputs
          path: build/release-inputs
      - name: Assemble the atomic Workflow Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/payload/repository-contract,build/payload/skills,build/release | Out-Null
          go build -trimpath -ldflags "-buildid= -X main.Version=${{ needs.worker.outputs.version }}" -o build/workflow.exe ./cmd/workflow
          go build -trimpath -ldflags "-buildid=" -o build/workflow-setup.exe ./cmd/workflow-setup
          Copy-Item -Recurse -Force deploy/platform/repository-contract/* build/payload/repository-contract/
          Copy-Item -Recurse -Force deploy/platform/skills/* build/payload/skills/
          go run ./cmd/workflow-release assemble `
            -config config/workflow-release.json -toolchain config/toolchain.json `
            -workflow-exe build/workflow.exe -setup-exe build/workflow-setup.exe -payload build/payload `
            -output build/release -source-commit $env:GITHUB_SHA -github-actions-run-id $env:GITHUB_RUN_ID `
            -worker-image '${{ needs.worker.outputs.image_repository }}@${{ needs.worker.outputs.image_digest }}' `
            -build-input build/release-inputs/build-input.json -sbom build/release-inputs/worker-sbom.spdx.json
          $names = @(Get-ChildItem build/release -File | Sort-Object Name | ForEach-Object Name)
          if (($names -join ' ') -cne 'worker-sbom.spdx.json workflow-release.json workflow-windows-amd64.zip') { throw "release output is not the exact three-asset set" }
      - name: Resolve fresh, retry, or immutable state
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.worker.outputs.tag }}"
          if ! release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/tmp/release-error)"; then
            grep -q 'HTTP 404' /tmp/release-error; echo "state=fresh" >> "$GITHUB_OUTPUT"; exit 0
          fi
          test "$(jq -r .target_commitish <<<"$release")" = "$GITHUB_SHA" || { echo "version belongs to another source" >&2; exit 1; }
          if jq -e '.immutable == true and .draft == false and .prerelease == false' <<<"$release" >/dev/null; then
            jq -e '([.assets[].name] | sort) == (["worker-sbom.spdx.json","workflow-release.json","workflow-windows-amd64.zip"] | sort)' <<<"$release" >/dev/null
            for name in worker-sbom.spdx.json workflow-release.json workflow-windows-amd64.zip; do
              digest="$(sha256sum "build/release/$name" | awk '{print $1}')"
              jq -e --arg name "$name" --arg digest "sha256:$digest" '[.assets[] | select(.name == $name and .digest == $digest)] | length == 1' <<<"$release" >/dev/null
            done
            tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
            jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' <<<"$tag_ref" >/dev/null
            echo "state=immutable" >> "$GITHUB_OUTPUT"
          elif jq -e '.draft == true and .immutable != true' <<<"$release" >/dev/null; then
            mapfile -t draft_manifest_ids < <(jq -r '.assets[] | select(.name == "workflow-release.json") | .id' <<<"$release")
            test "${#draft_manifest_ids[@]}" -le 1 || { echo "retry draft contains duplicate manifests" >&2; exit 1; }
            if [ "${#draft_manifest_ids[@]}" -eq 1 ]; then
              gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${draft_manifest_ids[0]}" > /tmp/draft-workflow-release.json
              jq -e \
                --arg version "${{ needs.worker.outputs.version }}" \
                --arg source "$GITHUB_SHA" \
                --arg identity "${{ needs.worker.outputs.identity }}" \
                --arg image "${{ needs.worker.outputs.image_repository }}@${{ needs.worker.outputs.image_digest }}" \
                '.version == $version and .source_commit == $source and .worker.build_input_identity == $identity and .worker.image == $image' \
                /tmp/draft-workflow-release.json >/dev/null || { echo "retry image digest differs from the failed draft" >&2; exit 1; }
            fi
            gh release delete "$tag" --yes --cleanup-tag=false; echo "state=fresh" >> "$GITHUB_OUTPUT"
          else
            echo "existing release is not retryable or an exact immutable result" >&2; exit 1
          fi
      - name: Stage exactly three assets
        if: steps.release.outputs.state == 'fresh'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.worker.outputs.tag }}" build/release/workflow-windows-amd64.zip build/release/workflow-release.json build/release/worker-sbom.spdx.json --draft --target "$GITHUB_SHA" --title "Workflow ${{ needs.worker.outputs.version }}" --notes "Immutable atomic Agent Workflow release."
      - name: Publish and verify immutable result
        if: steps.release.outputs.state == 'fresh'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.worker.outputs.tag }}"; gh release edit "$tag" --draft=false
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          jq --exit-status --arg sha "$GITHUB_SHA" '.draft == false and .prerelease == false and .immutable == true and .target_commitish == $sha and ([.assets[].name] | sort) == (["worker-sbom.spdx.json","workflow-release.json","workflow-windows-amd64.zip"] | sort)' <<<"$release" >/dev/null
          for name in worker-sbom.spdx.json workflow-release.json workflow-windows-amd64.zip; do
            digest="$(sha256sum "build/release/$name" | awk '{print $1}')"
            jq -e --arg name "$name" --arg digest "sha256:$digest" '[.assets[] | select(.name == $name and .digest == $digest)] | length == 1' <<<"$release" >/dev/null
          done
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
          jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' <<<"$tag_ref" >/dev/null
