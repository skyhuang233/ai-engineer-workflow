name: publish-platform

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cmd/platform-release/**"
      - "internal/platformrelease/**"
      - "internal/setupcontract/**"
      - "deploy/platform/**"
      - "cmd/workflow/**"
      - "config/platform-release.json"
      - ".github/workflows/publish-platform.yml"

permissions:
  contents: write

concurrency:
  group: publish-platform
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Read the versioned Platform Release input
        id: release
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath config/platform-release.json -Raw | ConvertFrom-Json
          if ($config.schema_version -ne 1) { throw "Unsupported platform-release.json schema" }
          $version = [string]$config.version
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw "platform-release.json version must be a bare semantic version core (X.Y.Z) without leading zeros" }
          foreach ($component in $version.Split('.')) {
            $value64 = [uint64]0
            if (-not [uint64]::TryParse($component, [ref]$value64) -or $value64 -gt 2147483647) { throw "platform-release.json version components must fit the signed 32-bit range" }
          }
          if ([string]::IsNullOrWhiteSpace([string]$config.docker_desktop.version) -or [string]::IsNullOrWhiteSpace([string]$config.docker_desktop.installer_url) -or [string]::IsNullOrWhiteSpace([string]$config.docker_desktop.windows_amd64_sha256) -or [string]::IsNullOrWhiteSpace([string]$config.worker_image)) { throw "platform-release.json lacks a required release input" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "docker_version=$([string]$config.docker_desktop.version)" >> $env:GITHUB_OUTPUT
          "docker_url=$([string]$config.docker_desktop.installer_url)" >> $env:GITHUB_OUTPUT
          "docker_sha256=$([string]$config.docker_desktop.windows_amd64_sha256)" >> $env:GITHUB_OUTPUT
          "worker_image=$([string]$config.worker_image)" >> $env:GITHUB_OUTPUT
      - name: Publish on a changed version or explicit dispatch
        id: version-change
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before:config/platform-release.json" 2>/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$before" "$GITHUB_SHA" -- config/platform-release.json; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous="$(git show "$before:config/platform-release.json" | jq -r '.version')"
          current="${{ steps.release.outputs.version }}"
          if [ "$previous" = "$current" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test release contracts
        if: steps.version-change.outputs.publish == 'true'
        shell: pwsh
        run: go test ./internal/setupcontract ./internal/platformrelease ./internal/doctor
      - name: Build Windows amd64 platform
        if: steps.version-change.outputs.publish == 'true'
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
          PLATFORM_VERSION: ${{ steps.release.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          go build -trimpath -ldflags "-buildid= -X main.Version=$env:PLATFORM_VERSION" -o build/workflow.exe ./cmd/workflow
          if ((& build/workflow.exe version | Out-String).Trim() -cne "workflow $env:PLATFORM_VERSION") { throw "built Workflow CLI version differs from platform-release.json" }
          go build -trimpath -ldflags "-buildid=" -o build/platform-release.exe ./cmd/platform-release
          New-Item -ItemType Directory -Force build/payload/repository-contract | Out-Null
          New-Item -ItemType Directory -Force build/payload/skills | Out-Null
          Copy-Item -Recurse -Force deploy/platform/repository-contract/* build/payload/repository-contract/
          Copy-Item -Recurse -Force deploy/platform/skills/* build/payload/skills/
      - name: Assemble Platform Release
        if: steps.version-change.outputs.publish == 'true'
        shell: pwsh
        run: |
          build/platform-release.exe `
            -workflow-exe build/workflow.exe -payload build/payload -output build/release `
            -version '${{ steps.release.outputs.version }}' -source-commit $env:GITHUB_SHA -github-actions-run-id $env:GITHUB_RUN_ID `
            -docker-version '${{ steps.release.outputs.docker_version }}' -docker-installer-url '${{ steps.release.outputs.docker_url }}' `
            -docker-installer-sha256 '${{ steps.release.outputs.docker_sha256 }}' -worker-image '${{ steps.release.outputs.worker_image }}'
      - name: Verify the minimal release package
        if: steps.version-change.outputs.publish == 'true'
        shell: bash
        run: |
          cd build/release
          sha256sum --check SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2
          test "$(find . -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "SHA256SUMS platform-release.json workflow-windows-amd64.zip "
      - name: Stage immutable Platform Release
        if: steps.version-change.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM_VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag="platform-v${PLATFORM_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to replace existing Platform Release $tag" >&2
            exit 1
          fi
          gh release create "$tag" build/release/* --draft --target "$GITHUB_SHA" --title "Platform ${PLATFORM_VERSION}" --notes "Immutable Agent Workflow platform release."
          gh release edit "$tag" --draft=false
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          jq --exit-status --arg sha "$GITHUB_SHA" '(.draft == false) and (.prerelease == false) and (.immutable == true) and (.target_commitish == $sha) and ([.assets[].name] | sort) == (["SHA256SUMS","platform-release.json","workflow-windows-amd64.zip"] | sort)' <<<"$release" >/dev/null
