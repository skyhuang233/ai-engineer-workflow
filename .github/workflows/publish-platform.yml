name: publish-platform

on:
  push:
    branches: [main]
    paths:
      - "cmd/platform-release/**"
      - "internal/platformrelease/**"
      - "internal/setupcontract/**"
      - "deploy/platform/**"
      - "cmd/workflow/**"
      - "config/toolchain.json"
      - ".github/workflows/publish-platform.yml"

permissions:
  contents: write
  pull-requests: read
  id-token: write

concurrency:
  group: publish-platform
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify owner-merged main commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          pulls="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
          pull_number="$(jq --raw-output --arg sha "$GITHUB_SHA" '[.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main")] | if length == 1 then .[0].number else empty end' <<<"$pulls")"
          test -n "$pull_number"
          pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pull_number}")"
          jq --exit-status --arg owner "$owner" --arg sha "$GITHUB_SHA" '(.merged_at != null) and (.merge_commit_sha == $sha) and (.base.ref == "main") and ((.merged_by.login | ascii_downcase) == $owner) and ((.merged_by.type | ascii_downcase) == "user") and ((.merged_by.login | endswith("[bot]")) | not)' <<<"$pull" >/dev/null
      - name: Test release contracts
        shell: pwsh
        run: go test ./internal/setupcontract ./internal/platformrelease ./internal/doctor
      - name: Build Windows amd64 platform
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
          PLATFORM_VERSION: ${{ vars.WORKFLOW_PLATFORM_VERSION }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PLATFORM_VERSION)) { throw "WORKFLOW_PLATFORM_VERSION is required" }
          New-Item -ItemType Directory -Force build | Out-Null
          go build -trimpath -ldflags "-buildid= -X main.Version=$env:PLATFORM_VERSION" -o build/workflow.exe ./cmd/workflow
          if ((& build/workflow.exe version | Out-String).Trim() -cne "workflow $env:PLATFORM_VERSION") { throw "built Workflow CLI version differs from WORKFLOW_PLATFORM_VERSION" }
          go build -trimpath -ldflags "-buildid=" -o build/platform-release.exe ./cmd/platform-release
          New-Item -ItemType Directory -Force build/payload/repository-contract | Out-Null
          New-Item -ItemType Directory -Force build/payload/skills | Out-Null
          Copy-Item -Recurse -Force deploy/platform/repository-contract/* build/payload/repository-contract/
          Copy-Item -Recurse -Force deploy/platform/skills/* build/payload/skills/
      - name: Assemble signed content-addressed release
        shell: pwsh
        env:
          PLATFORM_RELEASE_SIGNING_KEY_B64: ${{ secrets.PLATFORM_RELEASE_SIGNING_KEY_B64 }}
          DOCKER_DESKTOP_VERSION: ${{ vars.DOCKER_DESKTOP_VERSION }}
          DOCKER_DESKTOP_INSTALLER_URL: ${{ vars.DOCKER_DESKTOP_INSTALLER_URL }}
          DOCKER_DESKTOP_WINDOWS_AMD64_SHA256: ${{ vars.DOCKER_DESKTOP_WINDOWS_AMD64_SHA256 }}
          WORKER_IMAGE: ${{ vars.WORKFLOW_WORKER_IMAGE }}
          PLATFORM_VERSION: ${{ vars.WORKFLOW_PLATFORM_VERSION }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PLATFORM_RELEASE_SIGNING_KEY_B64)) { throw "protected Platform Release signing key is required" }
          [IO.File]::WriteAllBytes("build/signing-key.pem", [Convert]::FromBase64String($env:PLATFORM_RELEASE_SIGNING_KEY_B64))
          try {
            build/platform-release.exe `
              -workflow-exe build/workflow.exe -payload build/payload -output build/release `
              -version $env:PLATFORM_VERSION -source-commit $env:GITHUB_SHA -github-actions-run-id $env:GITHUB_RUN_ID `
              -docker-version $env:DOCKER_DESKTOP_VERSION -docker-installer-url $env:DOCKER_DESKTOP_INSTALLER_URL `
              -docker-installer-sha256 $env:DOCKER_DESKTOP_WINDOWS_AMD64_SHA256 -worker-image $env:WORKER_IMAGE `
              -signing-key build/signing-key.pem
          } finally {
            Remove-Item -LiteralPath build/signing-key.pem -Force -ErrorAction SilentlyContinue
          }
      - name: Verify checksum and provenance coverage
        shell: bash
        run: |
          cd build/release
          sha256sum --check SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5
          jq --exit-status --arg repository "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --argjson run_id "$GITHUB_RUN_ID" '.release.repository == $repository and .release.source_commit == $sha and .release.github_actions_run_id == $run_id and .provenance.workflow_path == ".github/workflows/publish-platform.yml" and ([.artifacts[].name] | sort) == (["platform-provenance.json","platform-sbom.spdx.json","workflow-windows-amd64.zip"] | sort)' platform-release.json >/dev/null
          test -s platform-release.json.sig
          test -s platform-sbom.spdx.json
          test -s platform-provenance.json
      - name: Stage immutable Platform Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM_VERSION: ${{ vars.WORKFLOW_PLATFORM_VERSION }}
        run: |
          tag="platform-v${PLATFORM_VERSION#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to replace existing Platform Release $tag" >&2
            exit 1
          fi
          gh release create "$tag" build/release/* --draft --target "$GITHUB_SHA" --title "Platform ${PLATFORM_VERSION}" --notes "Immutable Agent Workflow platform release for an owner-accepted main commit."
          gh release edit "$tag" --draft=false
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          jq --exit-status --arg sha "$GITHUB_SHA" '(.draft == false) and (.prerelease == false) and (.immutable == true) and (.target_commitish == $sha) and ([.assets[].name] | sort) == (["SHA256SUMS","platform-provenance.json","platform-release.json","platform-release.json.sig","platform-sbom.spdx.json","workflow-windows-amd64.zip"] | sort)' <<<"$release" >/dev/null
